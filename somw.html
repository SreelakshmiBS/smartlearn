<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 OLED Emoji Controller</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #fff;
}

.container {
  background: #1e1e1e;
  width: 98%;
  max-width: 520px;
  padding: 35px;
  border-radius: 22px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
  text-align: center;
}

h2 {
  margin-bottom: 25px;
  font-size: 26px;
  color: #00ffff;
  font-weight: 600;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

button {
  padding: 15px;
  font-size: 20px;
  font-weight: 600;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  background: linear-gradient(45deg, #ff6b6b, #feca57);
  color: #222;
  transition: 0.3s;
}

button:hover {
  transform: translateY(-3px) scale(1.07);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
}

.full {
  grid-column: 1 / -1;
}

video {
  width: 100%;
  max-width: 480px;
  height: auto;
  border-radius: 20px;
  border: 3px solid #00ffff;
  margin-top: 20px;
}
</style>
</head>

<body>

<div id="mainPage" class="container">
  <h2>ESP32 OLED Emoji Controller</h2>

  <div class="grid">
    <button onclick="sendEmoji('happy')">Happy</button>
    <button onclick="sendEmoji('sad')">Sad</button>
    <button onclick="sendEmoji('angry')">Angry</button>
    <button onclick="sendEmoji('crying')">Crying</button>
    <button onclick="sendEmoji('thinking')">Thinking</button>
    <button onclick="sendEmoji('surprised')">Surprised</button>
    <button onclick="sendEmoji('sleepy')">Sleepy</button>
    <button onclick="sendEmoji('annoyed')">Annoyed</button>

    <button class="full" onclick="openCameraPage()">Open Web Cam</button>
  </div>
</div>

<div id="cameraPage" class="container" style="display: none;">
  <h2>Web Camera</h2>

  <video id="cam" autoplay playsinline></video>

  <div class="grid" style="margin-top: 25px;">
    <button class="full" onclick="goBack()">Back</button>
  </div>
</div>

<script>
function sendEmoji(e) {
  fetch('/emoji?name=' + e);
}

// Switch to camera view and start camera
function openCameraPage() {
  document.getElementById("mainPage").style.display = "none";
  document.getElementById("cameraPage").style.display = "block";

  openCamera();  // Call your working function
}

// Your working camera function
function openCamera() {
  const video = document.getElementById('cam');

  navigator.mediaDevices.getUserMedia({
    video: {
      width: 1000,
      height: 1000,
      facingMode: "user"  
    },
    audio: false
  })
  .then(stream => {
    video.srcObject = stream;
  })
  .catch(err => {
    console.error(err);
    alert("Laptop camera blocked. Enable it in browser settings.");
    goBack();  // Return to main page on failure
  });
}

// Stop camera and return to main view
function goBack() {
  const video = document.getElementById("cam");
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }
  document.getElementById("cameraPage").style.display = "none";
  document.getElementById("mainPage").style.display = "block";
}
</script>

</body>
</html>
